name: macOS

on:
  push:
    branches: [main]
    paths: ["macos/**", "catalog/**", ".github/workflows/macos.yml"]
  pull_request:
    paths: ["macos/**", "catalog/**", ".github/workflows/macos.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: macos

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: bash scripts/build-app.sh

      - name: Self-test (catalog, VM configuration, screenshots)
        run: '"build/Try Linux.app/Contents/MacOS/TryLinux" --self-test build/selftest'

      - uses: actions/upload-artifact@v4
        with:
          name: TryLinux-macOS
          path: macos/build/TryLinux-*-macOS.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-macos
          path: macos/build/selftest
