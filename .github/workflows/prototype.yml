name: Prototype (Tauri)

# Builds the Tauri prototype (prototype/) on Linux (x86_64 and ARM64) and macOS (Apple silicon), runs its
# tests, and keeps each build as an artifact to download. On Linux, the disk and Recovery tests run on scratch
# folders with the runner's QEMU tools. The Windows build is made on the developer's PC for now.

on:
  push:
    paths: ["prototype/**", "icons/**", ".github/workflows/prototype.yml"]
  pull_request:
    paths: ["prototype/**", "icons/**", ".github/workflows/prototype.yml"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            name: linux-x86_64
          - runner: ubuntu-24.04-arm
            name: linux-aarch64
          - runner: macos-15
            name: macos-aarch64
    runs-on: ${{ matrix.runner }}
    name: Build (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: prototype/ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: prototype/src-tauri

      - name: Install Tauri's libraries and QEMU (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config build-essential qemu-utils

      - name: Build the interface
        working-directory: prototype/ui
        run: |
          npm ci
          npm run build

      - name: Build the app
        working-directory: prototype/src-tauri
        run: cargo build --release --locked

      - name: Tests
        working-directory: prototype/src-tauri
        run: cargo test --locked

      # Disk Utilities and Recovery on scratch systems (qemu-img from the runner's QEMU), never real ones.
      - name: Disk and Recovery tests (Linux)
        if: runner.os == 'Linux'
        working-directory: prototype/src-tauri
        run: |
          TRYLINUX_TEST_DIR="$RUNNER_TEMP/disk-test" cargo test --locked disk_utilities -- --ignored --nocapture
          TRYLINUX_TEST_DIR="$RUNNER_TEMP/recovery-test" cargo test --locked recovery_actions -- --ignored --nocapture

      # Finding each built-in distribution's current installer on its mirror (listings and checksums only).
      - name: Installer search test
        working-directory: prototype/src-tauri
        run: cargo test --locked resolves_built_in -- --ignored --nocapture

      # Apple's Virtualization framework only runs in an app signed with its entitlement; an ad-hoc signature
      # is enough on your own Mac.
      - name: Sign with the Virtualization entitlement (macOS)
        if: runner.os == 'macOS'
        working-directory: prototype/src-tauri
        run: |
          codesign --force --sign - --entitlements macos/entitlements.plist target/release/try-linux-prototype
          codesign --display --entitlements - target/release/try-linux-prototype

      - uses: actions/upload-artifact@v4
        with:
          name: try-linux-prototype-${{ matrix.name }}
          path: prototype/src-tauri/target/release/try-linux-prototype
          if-no-files-found: error
