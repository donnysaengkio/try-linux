name: Windows

on:
  push:
    branches: [main]
    paths: ["windows/**", "catalog/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "catalog/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: windows

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build TryLinux.exe (the C# compiler that ships with Windows)
        shell: cmd
        run: build.cmd

      - name: Find each built-in distribution's installer and checksum
        shell: pwsh
        run: |
          Start-Process -FilePath .\TryLinux.exe -ArgumentList '--resolve-test', "$PWD\resolve.txt" -Wait
          Get-Content resolve.txt
          if (Select-String -Path resolve.txt -Pattern "`tERROR`t|no-checksum") { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: TryLinux-windows
          path: |
            windows/TryLinux.exe
            windows/resolve.txt
