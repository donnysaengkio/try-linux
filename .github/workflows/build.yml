name: Build

# Builds Try Linux on Windows, Linux (x86_64 and ARM64) and macOS (Apple silicon), runs its tests, and keeps each
# build as an artifact to download, with the Linux AppImages. On Linux, the disk, Recovery and 1.0.x takeover tests
# run on scratch folders with the runner's QEMU tools. Releases are made and signed on the developer's PC
# (scripts/, docs/development.md).

on:
  push:
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            name: windows-x86_64
          - runner: ubuntu-24.04
            name: linux-x86_64
          - runner: ubuntu-24.04-arm
            name: linux-aarch64
          - runner: macos-15
            name: macos-aarch64
    runs-on: ${{ matrix.runner }}
    name: Build (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri's libraries and QEMU (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config build-essential qemu-utils file

      - name: Build the interface
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Build the app
        working-directory: src-tauri
        run: cargo build --release --locked

      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked

      # Disk Utilities, Recovery and the 1.0.x takeover on scratch folders (qemu-img from the runner's QEMU), never
      # real ones.
      - name: Disk, Recovery and takeover tests (Linux)
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: |
          TRYLINUX_TEST_DIR="$RUNNER_TEMP/disk-test" cargo test --locked disk_utilities -- --ignored --nocapture
          TRYLINUX_TEST_DIR="$RUNNER_TEMP/recovery-test" cargo test --locked recovery_actions -- --ignored --nocapture
          TRYLINUX_TEST_DIR="$RUNNER_TEMP/legacy-test" cargo test --locked takes_over_linux_edition -- --ignored --nocapture

      # Finding each built-in distribution's current installer on its mirror (listings and checksums only).
      - name: Installer search test
        working-directory: src-tauri
        run: cargo test --locked resolves_built_in -- --ignored --nocapture

      # Apple's Virtualization framework only runs in an app signed with its entitlement; an ad-hoc signature
      # is enough on your own Mac.
      - name: Sign with the Virtualization entitlement (macOS)
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: |
          codesign --force --sign - --entitlements macos/entitlements.plist target/release/try-linux
          codesign --display --entitlements - target/release/try-linux

      - uses: actions/upload-artifact@v4
        with:
          name: try-linux-${{ matrix.name }}
          path: |
            src-tauri/target/release/try-linux
            src-tauri/target/release/try-linux.exe
          if-no-files-found: error

      # The AppImage, as released. Its update signature is added on the developer's PC (scripts/release-linux.sh
      # --add), where the signing key stays. linuxdeploy runs extracted, as runners have no FUSE.
      - name: AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          ./ui/node_modules/.bin/tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          ls -la src-tauri/target/release/bundle/appimage/

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: try-linux-appimage-${{ matrix.name }}
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      # The Mac app, as released: Try Linux.app, signed ad hoc with the Virtualization entitlement
      # (tauri.macos.conf.json). TryLinux-macOS.zip is what Mac 1.x updates to (it checks the app's signature and
      # puts it in place of its own); Try Linux.app.tar.gz is what 2.x's updater takes, its update signature added on
      # the developer's PC (scripts/release-macos.sh), where the signing key stays.
      - name: Mac app (macOS)
        if: runner.os == 'macOS'
        run: |
          ./ui/node_modules/.bin/tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          cd "src-tauri/target/release/bundle/macos"
          codesign --verify --deep --strict --verbose=2 "Try Linux.app"
          codesign --display --entitlements - "Try Linux.app"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" -c "Print :CFBundleIdentifier" -c "Print :CFBundleShortVersionString" "Try Linux.app/Contents/Info.plist"
          mkdir -p "$RUNNER_TEMP/mac"
          ditto -c -k --keepParent "Try Linux.app" "$RUNNER_TEMP/mac/TryLinux-macOS.zip"
          COPYFILE_DISABLE=1 tar -czf "$RUNNER_TEMP/mac/Try Linux.app.tar.gz" "Try Linux.app"
          ls -la "$RUNNER_TEMP/mac"

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: try-linux-macos-app
          path: ${{ runner.temp }}/mac/*
          if-no-files-found: error
