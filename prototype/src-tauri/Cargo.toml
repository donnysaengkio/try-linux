[package]
name = "try-linux-prototype"
version = "0.2.0"
description = "A prototype of Try Linux as one Tauri app for Windows, macOS and Linux"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
ureq = "2"
tauri-plugin-dialog = "2"
regex = "1"
sha2 = "0.10"
tauri-plugin-single-instance = "2"
trash = "5"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-virtualization = "0.3.2"

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.3"
